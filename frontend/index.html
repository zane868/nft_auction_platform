<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MetaNFT - Sepolia</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif;
      background: #0f1117;
      color: #e6e6e6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .container { width: 100%; max-width: 560px; }
    h1 { font-size: 24px; margin-bottom: 4px; }
    .subtitle { color: #8a8f98; font-size: 14px; margin-bottom: 24px; }
    .subtitle a { color: #6ea8fe; text-decoration: none; }
    .card {
      background: #181b22;
      border: 1px solid #262b35;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .card h2 { font-size: 16px; margin-bottom: 12px; color: #c8cdd5; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    label { font-size: 13px; color: #8a8f98; }
    .value { font-family: monospace; font-size: 13px; word-break: break-all; }
    button {
      background: #2d6cdf;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover:not(:disabled) { background: #3f7ef0; }
    button:disabled { background: #2a2e38; color: #666c78; cursor: not-allowed; }
    button.danger { background: #b3383c; }
    button.danger:hover:not(:disabled) { background: #cc4448; }
    input {
      background: #0f1117;
      border: 1px solid #262b35;
      border-radius: 8px;
      padding: 9px 12px;
      color: #e6e6e6;
      font-size: 14px;
      width: 120px;
    }
    input:focus { outline: none; border-color: #2d6cdf; }
    .price-field { display: block; margin-bottom: 12px; }
    .price-field input { display: block; width: 100%; margin-top: 6px; }
    #status {
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #0f1117;
      border: 1px solid #262b35;
      min-height: 20px;
      word-break: break-all;
    }
    #status.ok { border-color: #2d7d46; color: #7bd88f; }
    #status.err { border-color: #b3383c; color: #ef8a8d; }
    .stat { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
    .stat span:last-child { font-family: monospace; }
  </style>
</head>
<body>
  <div class="container">
    <h1>MetaNFT</h1>
    <p class="subtitle">
      Sepolia 测试网 ·
      <a id="explorerLink" href="#" target="_blank" rel="noopener">合约地址</a>
    </p>

    <div class="card">
      <h2>钱包</h2>
      <div class="row">
        <button id="connectBtn">连接 MetaMask</button>
        <span class="value" id="account">未连接</span>
      </div>
    </div>

    <div class="card">
      <h2>合约信息</h2>
      <div class="stat"><span>名称</span><span id="nftName">-</span></div>
      <div class="stat"><span>符号</span><span id="nftSymbol">-</span></div>
      <div class="stat"><span>总铸造量</span><span id="totalSupply">-</span></div>
      <div class="stat"><span>我的持有量</span><span id="myBalance">-</span></div>
    </div>

    <div class="card">
      <h2>我的 NFT</h2>
      <div class="row">
        <button id="myTokensBtn" disabled>刷新列表</button>
      </div>
      <p style="margin-top:10px"><span class="value" id="myTokens">-</span></p>
    </div>

    <div class="card">
      <h2>铸造</h2>
      <div class="row">
        <button id="mintBtn" disabled>铸造一枚 NFT 给自己</button>
      </div>
    </div>

    <div class="card">
      <h2>查询持有者</h2>
      <div class="row">
        <input id="queryId" type="number" min="1" placeholder="Token ID" />
        <button id="queryBtn" disabled>查询 ownerOf</button>
      </div>
      <p style="margin-top:10px"><span class="value" id="queryResult"></span></p>
    </div>

    <div class="card">
      <h2>销毁</h2>
      <div class="row">
        <input id="burnId" type="number" min="1" placeholder="Token ID" />
        <button id="burnBtn" class="danger" disabled>销毁我的 NFT</button>
      </div>
    </div>

    <div class="card">
      <h2>美元价格换算</h2>
      <label class="price-field" for="auctionAddress">Sepolia 拍卖合约地址（代理地址）
        <input id="auctionAddress" value="0x9BE26b17409AB84D4745c6110784c0aefF9d0b01" placeholder="0x…" autocomplete="off" spellcheck="false" />
      </label>
      <p style="margin-bottom:10px">拍卖合约 owner：<span class="value" id="auctionOwner">读取中…</span></p>
      <p style="margin-bottom:12px" id="ownerStatus" aria-live="polite">未连接钱包，无法判断是否为 owner</p>
      <button id="refreshOwnerBtn" style="margin-bottom:12px">刷新 owner 状态</button>
      <label class="price-field" for="newOwnerAddress">新 owner 地址
        <input id="newOwnerAddress" placeholder="0x…" autocomplete="off" spellcheck="false" />
      </label>
      <button id="transferOwnerBtn" class="danger" disabled>转移 owner</button>
      <p style="margin:10px 0 16px;font-size:13px;color:#8a8f98">交易成功后，新地址立即获得喂价设置及合约升级权限，当前 owner 失去这些权限。请确认新地址由你或预期的接收方控制。</p>
      <label class="price-field" for="priceToken">支付代币地址（原生 ETH 使用零地址）
        <input id="priceToken" value="0x0000000000000000000000000000000000000000" autocomplete="off" spellcheck="false" />
      </label>
      <label class="price-field" for="priceAmount">代币数量
        <input id="priceAmount" inputmode="decimal" placeholder="例如 0.1" />
      </label>
      <div class="row">
        <button id="oracleBtn">查询 tokenToOracle</button>
        <button id="getTokenOracleBtn">查询 getTokenOracle</button>
        <button id="priceBtn">查询美元价值</button>
      </div>
      <p style="margin-top:10px">喂价地址：<span class="value" id="oracleResult" aria-live="polite">-</span></p>
      <p style="margin-top:10px"><span class="value" id="priceResult" aria-live="polite">-</span></p>
      <label class="price-field" for="oracleAddress" style="margin-top:16px">新的 USD 喂价合约地址（Sepolia）
        <input id="oracleAddress" placeholder="0x…" autocomplete="off" spellcheck="false" />
      </label>
      <button id="setOracleBtn" disabled>设置代币喂价（仅 owner）</button>
      <p style="margin-top:10px;font-size:13px;color:#8a8f98">设置会更新上方支付代币的喂价映射，需钱包确认并支付 Sepolia ETH gas。</p>
      <p style="margin-top:10px;font-size:13px;color:#8a8f98">拍卖合约需先为该代币配置以 USD 计价的喂价。此查询无需连接钱包。</p>
    </div>

    <div id="status">就绪</div>
  </div>

  <script type="module">
    import {
      createPublicClient, createWalletClient, custom, http, isAddress, parseUnits, formatUnits, zeroAddress,
    } from "https://esm.sh/viem@2";
    import { sepolia } from "https://esm.sh/viem@2/chains";

    const CONTRACT_ADDRESS = "0xa89C089c8aD4d0d32aF3d2dC89BA96D0ef069a22";

    // MetaNFT (ERC721Enumerable): name, symbol, totalSupply, balanceOf, ownerOf, mint, burn, GetTokenIdsOfOwner
    const ABI = [
      { type: "function", name: "name", stateMutability: "view", inputs: [], outputs: [{ type: "string" }] },
      { type: "function", name: "symbol", stateMutability: "view", inputs: [], outputs: [{ type: "string" }] },
      { type: "function", name: "totalSupply", stateMutability: "view", inputs: [], outputs: [{ type: "uint256" }] },
      { type: "function", name: "balanceOf", stateMutability: "view", inputs: [{ name: "owner", type: "address" }], outputs: [{ type: "uint256" }] },
      { type: "function", name: "ownerOf", stateMutability: "view", inputs: [{ name: "tokenId", type: "uint256" }], outputs: [{ type: "address" }] },
      { type: "function", name: "mint", stateMutability: "nonpayable", inputs: [{ name: "to", type: "address" }], outputs: [{ type: "uint256" }] },
      { type: "function", name: "burn", stateMutability: "nonpayable", inputs: [{ name: "id", type: "uint256" }], outputs: [] },
      { type: "function", name: "GetTokenIdsOfOwner", stateMutability: "view", inputs: [], outputs: [{ type: "uint256[]" }] },
    ];

    const AUCTION_ABI = [
      { type: "function", name: "transferOwnership", stateMutability: "nonpayable", inputs: [{ name: "newOwner", type: "address" }], outputs: [] },
      { type: "function", name: "owner", stateMutability: "view", inputs: [], outputs: [{ type: "address" }] },
      { type: "function", name: "setTokenOracle", stateMutability: "nonpayable", inputs: [{ name: "token", type: "address" }, { name: "oracle", type: "address" }], outputs: [] },
      { type: "function", name: "getTokenOracle", stateMutability: "view", inputs: [{ name: "token", type: "address" }], outputs: [{ type: "address" }] },
      { type: "function", name: "tokenToOracle", stateMutability: "view", inputs: [{ name: "token", type: "address" }], outputs: [{ type: "address" }] },
      { type: "function", name: "getPriceInDollar", stateMutability: "view", inputs: [{ name: "token", type: "address" }, { name: "amount", type: "uint256" }], outputs: [{ type: "uint256" }] },
    ];
    const TOKEN_DECIMALS_ABI = [
      { type: "function", name: "decimals", stateMutability: "view", inputs: [], outputs: [{ type: "uint8" }] },
    ];

    const $ = (id) => document.getElementById(id);
    const status = (msg, cls = "") => {
      $("status").textContent = msg;
      $("status").className = cls;
    };

    $("explorerLink").href = `https://sepolia.etherscan.io/address/${CONTRACT_ADDRESS}`;
    $("explorerLink").textContent = CONTRACT_ADDRESS;

    const publicClient = createPublicClient({ chain: sepolia, transport: http() });
    let walletClient = null;
    let account = null;
    let ownerRequest = 0;
    let settingOracle = false;
    let transferringOwner = false;

    async function refreshOwnerStatus() {
      const request = ++ownerRequest;
      const address = $("auctionAddress").value.trim();
      $("setOracleBtn").disabled = true;
      $("transferOwnerBtn").disabled = true;
      $("auctionOwner").textContent = "读取中…";
      $("ownerStatus").textContent = "正在检查 owner…";
      try {
        if (!isAddress(address) || address.toLowerCase() === zeroAddress) {
          throw new Error("请输入有效的拍卖合约地址");
        }
        const owner = await publicClient.readContract({ address, abi: AUCTION_ABI, functionName: "owner" });
        const chainId = walletClient && account ? await walletClient.getChainId() : null;
        if (request !== ownerRequest || address !== $("auctionAddress").value.trim()) return false;
        $("auctionOwner").textContent = owner;
        const isOwner = !!account && owner.toLowerCase() === account.toLowerCase();
        $("ownerStatus").textContent = !account ? "未连接钱包，无法判断是否为 owner"
          : chainId !== sepolia.id ? "钱包未连接 Sepolia，请切换网络"
          : isOwner ? "当前钱包是 owner，可以设置喂价和转移 owner" : "当前钱包不是 owner，只能查询喂价";
        $("setOracleBtn").disabled = settingOracle || transferringOwner || !isOwner || chainId !== sepolia.id;
        $("transferOwnerBtn").disabled = settingOracle || transferringOwner || !isOwner || chainId !== sepolia.id;
        return isOwner && chainId === sepolia.id;
      } catch (e) {
        if (request !== ownerRequest) return false;
        $("auctionOwner").textContent = "读取失败";
        $("ownerStatus").textContent = `无法判断 owner: ${e.shortMessage ?? e.message}`;
        return false;
      }
    }

    $("refreshOwnerBtn").onclick = refreshOwnerStatus;
    $("auctionAddress").addEventListener("input", () => {
      $("oracleResult").textContent = "-";
      $("priceResult").textContent = "-";
      refreshOwnerStatus();
    });
    $("priceToken").addEventListener("input", () => {
      $("oracleResult").textContent = "-";
      $("priceResult").textContent = "-";
    });

    $("setOracleBtn").onclick = async () => {
      if (settingOracle || transferringOwner) return;
      if (!walletClient || !account) { status("请先连接钱包", "err"); return; }
      const address = $("auctionAddress").value.trim();
      const token = $("priceToken").value.trim();
      const oracle = $("oracleAddress").value.trim();
      if (!isAddress(token)) { status("请输入有效的支付代币地址", "err"); return; }
      if (!isAddress(oracle) || oracle.toLowerCase() === zeroAddress) {
        status("请输入有效的非零喂价地址", "err"); return;
      }
      settingOracle = true;
      $("setOracleBtn").disabled = true;
      try {
        if (!await refreshOwnerStatus()) throw new Error("当前钱包必须是 Sepolia 拍卖合约的 owner");
        const sender = account;
        if (address !== $("auctionAddress").value.trim()) throw new Error("合约地址已改变，请重新提交");
        status("设置喂价：等待钱包确认...");
        const { request } = await publicClient.simulateContract({
          address, abi: AUCTION_ABI, functionName: "setTokenOracle", args: [token, oracle], account: sender,
        });
        const [activeAccount] = await walletClient.getAddresses();
        if (activeAccount?.toLowerCase() !== sender.toLowerCase() || await walletClient.getChainId() !== sepolia.id) {
          throw new Error("钱包账户或网络已改变，请重新提交");
        }
        const hash = await walletClient.writeContract({ ...request, chain: sepolia });
        status(`设置喂价：交易已发送 ${hash}，等待确认...`);
        const receipt = await publicClient.waitForTransactionReceipt({ hash });
        if (receipt.status !== "success") throw new Error("交易执行失败");
        if (address === $("auctionAddress").value.trim() && token === $("priceToken").value.trim()) {
          const currentOracle = await publicClient.readContract({ address, abi: AUCTION_ABI, functionName: "tokenToOracle", args: [token] });
          $("oracleResult").textContent = currentOracle;
          $("priceResult").textContent = "-";
        }
        status(`喂价设置成功！区块 ${receipt.blockNumber}`, "ok");
      } catch (e) {
        status(`设置喂价失败: ${e.shortMessage ?? e.message}`, "err");
      } finally {
        settingOracle = false;
        await refreshOwnerStatus();
      }
    };

    $("transferOwnerBtn").onclick = async () => {
      if (settingOracle || transferringOwner) return;
      if (!walletClient || !account) { status("请先连接钱包", "err"); return; }
      const address = $("auctionAddress").value.trim();
      const newOwner = $("newOwnerAddress").value.trim();
      if (!isAddress(newOwner) || newOwner.toLowerCase() === zeroAddress) {
        status("请输入有效的非零新 owner 地址", "err"); return;
      }
      if (newOwner.toLowerCase() === account.toLowerCase()) {
        status("新 owner 地址不能与当前 owner 相同", "err"); return;
      }
      transferringOwner = true;
      $("transferOwnerBtn").disabled = true;
      $("setOracleBtn").disabled = true;
      try {
        if (!await refreshOwnerStatus()) throw new Error("当前钱包必须是 Sepolia 拍卖合约的 owner");
        const sender = account;
        if (address !== $("auctionAddress").value.trim()) throw new Error("合约地址已改变，请重新提交");
        status(`转移 owner 至 ${newOwner}：等待钱包确认...`);
        const { request } = await publicClient.simulateContract({
          address, abi: AUCTION_ABI, functionName: "transferOwnership", args: [newOwner], account: sender,
        });
        const [activeAccount] = await walletClient.getAddresses();
        if (activeAccount?.toLowerCase() !== sender.toLowerCase() || await walletClient.getChainId() !== sepolia.id) {
          throw new Error("钱包账户或网络已改变，请重新提交");
        }
        if (address !== $("auctionAddress").value.trim() || newOwner !== $("newOwnerAddress").value.trim()) {
          throw new Error("合约或新 owner 地址已改变，请重新提交");
        }
        const hash = await walletClient.writeContract({ ...request, chain: sepolia });
        status(`转移 owner：交易已发送 ${hash}，等待确认...`);
        const receipt = await publicClient.waitForTransactionReceipt({ hash });
        if (receipt.status !== "success") throw new Error("交易执行失败");
        status(`owner 已转移至 ${newOwner}！区块 ${receipt.blockNumber}`, "ok");
      } catch (e) {
        status(`转移 owner 失败: ${e.shortMessage ?? e.message}`, "err");
      } finally {
        transferringOwner = false;
        await refreshOwnerStatus();
      }
    };

    if (window.ethereum?.on) {
      window.ethereum.on("accountsChanged", async (accounts) => {
        account = accounts[0] ?? null;
        $("account").textContent = account ?? "未连接";
        $("connectBtn").textContent = account ? "已连接" : "连接 MetaMask";
        ["mintBtn", "queryBtn", "burnBtn", "myTokensBtn"].forEach(id => ($(id).disabled = !account));
        $("myBalance").textContent = "-";
        $("myTokens").textContent = "-";
        await refreshOwnerStatus();
        if (account) Promise.all([refreshBalance(), refreshMyTokens()]).catch(e => status(`读取钱包信息失败: ${e.shortMessage ?? e.message}`, "err"));
      });
      window.ethereum.on("chainChanged", refreshOwnerStatus);
      window.ethereum.on("disconnect", () => {
        account = null;
        $("account").textContent = "未连接";
        $("connectBtn").textContent = "连接 MetaMask";
        ["mintBtn", "queryBtn", "burnBtn", "myTokensBtn"].forEach(id => ($(id).disabled = true));
        refreshOwnerStatus();
      });
    }

    async function loadContractInfo() {
      const [name, symbol, supply] = await Promise.all([
        publicClient.readContract({ address: CONTRACT_ADDRESS, abi: ABI, functionName: "name" }),
        publicClient.readContract({ address: CONTRACT_ADDRESS, abi: ABI, functionName: "symbol" }),
        publicClient.readContract({ address: CONTRACT_ADDRESS, abi: ABI, functionName: "totalSupply" }),
      ]);
      $("nftName").textContent = name;
      $("nftSymbol").textContent = symbol;
      $("totalSupply").textContent = supply.toString();
    }

    async function refreshBalance() {
      if (!account) return;
      const bal = await publicClient.readContract({
        address: CONTRACT_ADDRESS, abi: ABI, functionName: "balanceOf", args: [account],
      });
      $("myBalance").textContent = bal.toString();
    }

    async function refreshMyTokens() {
      if (!account) return;
      try {
        const ids = await publicClient.readContract({
          address: CONTRACT_ADDRESS, abi: ABI, functionName: "GetTokenIdsOfOwner", account,
        });
        $("myTokens").textContent = ids.length ? ids.map((i) => `#${i}`).join(", ") : "（暂无）";
      } catch (e) {
        $("myTokens").textContent = `查询失败: ${e.shortMessage ?? e.message}`;
      }
    }

    async function queryOracle(functionName, buttonId) {
      const address = $("auctionAddress").value.trim();
      const token = $("priceToken").value.trim();
      $("oracleResult").textContent = "-";
      if (!isAddress(address) || address.toLowerCase() === zeroAddress) {
        status("请输入有效的拍卖合约地址", "err"); return;
      }
      if (!isAddress(token)) {
        status("请输入有效的代币地址，原生 ETH 使用零地址", "err"); return;
      }
      $(buttonId).disabled = true;
      try {
        status(`${functionName}：正在查询喂价地址...`);
        const oracle = await publicClient.readContract({
          address, abi: AUCTION_ABI, functionName, args: [token],
        });
        const unset = oracle.toLowerCase() === zeroAddress;
        $("oracleResult").textContent = `${functionName}：${unset ? "未配置（零地址）" : oracle}`;
        status(unset ? "该代币尚未配置喂价" : "喂价地址查询成功", unset ? "err" : "ok");
      } catch (e) {
        $("oracleResult").textContent = "查询失败";
        status(`喂价地址查询失败: ${e.shortMessage ?? e.message}`, "err");
      } finally {
        $(buttonId).disabled = false;
      }
    }

    $("oracleBtn").onclick = () => queryOracle("tokenToOracle", "oracleBtn");
    $("getTokenOracleBtn").onclick = () => queryOracle("getTokenOracle", "getTokenOracleBtn");

    $("priceBtn").onclick = async () => {
      const address = $("auctionAddress").value.trim();
      const token = $("priceToken").value.trim();
      const amountText = $("priceAmount").value.trim();
      $("priceResult").textContent = "-";
      if (!isAddress(address) || address.toLowerCase() === zeroAddress) {
        status("请输入有效的拍卖合约地址", "err"); return;
      }
      if (!isAddress(token)) {
        status("请输入有效的代币地址，原生 ETH 使用零地址", "err"); return;
      }
      if (!/^\d+(\.\d+)?$/.test(amountText)) {
        status("请输入有效的非负代币数量", "err"); return;
      }
      $("priceBtn").disabled = true;
      try {
        status("正在查询美元价值...");
        const decimals = token.toLowerCase() === zeroAddress ? 18 : await publicClient.readContract({
          address: token, abi: TOKEN_DECIMALS_ABI, functionName: "decimals",
        });
        if ((amountText.split(".")[1]?.length ?? 0) > decimals) {
          throw new Error(`该代币最多支持 ${decimals} 位小数`);
        }
        const amount = parseUnits(amountText, decimals);
        const dollars = await publicClient.readContract({
          address, abi: AUCTION_ABI, functionName: "getPriceInDollar", args: [token, amount],
        });
        // 当前合约的返回值保留输入代币的精度，而不是喂价精度。
        $("priceResult").textContent = `${formatUnits(dollars, decimals)} USD`;
        status("美元价值查询成功", "ok");
      } catch (e) {
        $("priceResult").textContent = "查询失败";
        status(`美元价值查询失败: ${e.shortMessage ?? e.message}`, "err");
      } finally {
        $("priceBtn").disabled = false;
      }
    };

    $("connectBtn").onclick = async () => {
      if (!window.ethereum) { status("未检测到 MetaMask", "err"); return; }
      try {
        walletClient = createWalletClient({ chain: sepolia, transport: custom(window.ethereum) });
        const [addr] = await walletClient.requestAddresses();
        account = addr;
        const chainId = await walletClient.getChainId();
        if (chainId !== sepolia.id) {
          await walletClient.switchChain({ id: sepolia.id });
        }
        $("account").textContent = addr;
        $("connectBtn").textContent = "已连接";
        ["mintBtn", "queryBtn", "burnBtn", "myTokensBtn"].forEach((id) => ($(id).disabled = false));
        status("钱包已连接", "ok");
        await Promise.all([refreshOwnerStatus(), refreshBalance(), refreshMyTokens()]);
      } catch (e) {
        status(`连接失败: ${e.shortMessage ?? e.message}`, "err");
      }
    };

    async function sendTx(functionName, args, label) {
      try {
        status(`${label}: 等待钱包确认...`);
        // 用公共 RPC 预估 gas（乘 1.2 缓冲），避免 MetaMask 在 revert 场景下给出异常高的 gas
        const estimated = await publicClient.estimateContractGas({
          address: CONTRACT_ADDRESS, abi: ABI, functionName, args, account,
        });
        const gas = (estimated * 120n) / 100n;
        const hash = await walletClient.writeContract({
          address: CONTRACT_ADDRESS, abi: ABI, functionName, args, account, chain: sepolia, gas,
        });
        status(`${label}: 交易已发送 ${hash}，等待确认...`);
        const receipt = await publicClient.waitForTransactionReceipt({ hash });
        status(`${label} 成功！区块 ${receipt.blockNumber}`, "ok");
        await Promise.all([refreshBalance(), refreshMyTokens(), loadContractInfo()]);
        return receipt;
      } catch (e) {
        status(`${label}失败: ${e.shortMessage ?? e.message}`, "err");
        return null;
      }
    }

    $("mintBtn").onclick = () => sendTx("mint", [account], "铸造");
    $("myTokensBtn").onclick = refreshMyTokens;
    $("burnBtn").onclick = async () => {
      const id = $("burnId").value;
      if (!id || Number(id) < 1) { status("请输入有效的 Token ID", "err"); return; }
      try {
        const owner = await publicClient.readContract({
          address: CONTRACT_ADDRESS, abi: ABI, functionName: "ownerOf", args: [BigInt(id)],
        });
        if (owner.toLowerCase() !== account.toLowerCase()) {
          status(`销毁失败: 你并非 #${id} 的持有者（持有者: ${owner}）`, "err");
          return;
        }
      } catch {
        status(`销毁失败: Token #${id} 不存在`, "err");
        return;
      }
      sendTx("burn", [BigInt(id)], `销毁 #${id}`);
    };

    $("queryBtn").onclick = async () => {
      const id = $("queryId").value;
      if (!id || Number(id) < 1) { status("请输入有效的 Token ID", "err"); return; }
      try {
        const owner = await publicClient.readContract({
          address: CONTRACT_ADDRESS, abi: ABI, functionName: "ownerOf", args: [BigInt(id)],
        });
        $("queryResult").textContent = `#${id} 持有者: ${owner}`;
      } catch (e) {
        $("queryResult").textContent = `#${id} 不存在或查询失败`;
      }
    };

    refreshOwnerStatus();
    loadContractInfo().catch((e) => status(`读取合约信息失败: ${e.message}`, "err"));
  </script>
</body>
</html>
